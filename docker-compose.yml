version: "3.9"

services:
  api-gateway:
    build: ./api-gateway
    depends_on:
      - auth-service
      - medical-service
    environment:
      GATEWAY_PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:8081
      MEDICAL_SERVICE_URL: http://medical-service:8082
      JWT_SECRET: dev-secret
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"

  auth-service:
    build: ./auth-service
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      AUTH_PORT: "8081"
      AUTH_DATABASE_URL: postgres://postgres:postgres@postgres-auth:5432/postgres?sslmode=disable
      JWT_SECRET: dev-secret
    ports:
      - "8081:8081"

  medical-service:
    build: ./medical-service
    depends_on:
      postgres-medical:
        condition: service_healthy
    environment:
      MEDICAL_PORT: "8082"
      MEDICAL_DATABASE_URL: postgres://postgres:postgres@postgres-medical:5432/postgres?sslmode=disable
      JWT_SECRET: dev-secret
    ports:
      - "8082:8082"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://api-gateway:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  postgres-medical:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-medical-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

volumes:
  postgres-auth-data:
  postgres-medical-data:

